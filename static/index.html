<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comida Campus · Universidad de Ibagué</title>
<style>
  :root { --fondo:#f6f4ef; --tarjeta:#fff; --texto:#1f2421; --suave:#6b716d; --acento:#1d6b4f; --borde:#e3e0d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--fondo); color:var(--texto);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; border-bottom:1px solid var(--borde); background:var(--tarjeta); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; }
  header .info { font-size:12px; color:var(--suave); margin-left:auto; text-align:right; }
  header button { border:1px solid var(--borde); background:none; border-radius:6px; padding:6px 10px; cursor:pointer; color:var(--suave); }
  main { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; line-height:1.45; white-space:pre-wrap; }
  .usuario { align-self:flex-end; background:var(--acento); color:#fff; border-bottom-right-radius:3px; }
  .bot { align-self:flex-start; background:var(--tarjeta); border:1px solid var(--borde); border-bottom-left-radius:3px; }
  .traza { align-self:flex-start; font-size:12px; color:var(--suave); font-family: ui-monospace, Menlo, monospace;
           background:#efece5; border-radius:8px; padding:6px 10px; max-width:85%; overflow-wrap:anywhere; }
  .traza .err { color:#a33; }
  .ejemplos { display:flex; flex-wrap:wrap; gap:8px; }
  .ejemplos button { border:1px solid var(--borde); background:var(--tarjeta); border-radius:16px; padding:6px 12px; cursor:pointer; font-size:13px; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--borde); background:var(--tarjeta); max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border:1px solid var(--borde); border-radius:8px; font-size:15px; }
  form button { background:var(--acento); color:#fff; border:none; border-radius:8px; padding:0 18px; font-size:15px; cursor:pointer; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>🍽️ Comida Campus</h1>
  <button id="reiniciar" title="Borrar la conversación">Nueva conversación</button>
  <a href="/admin" target="_blank" style="font-size:13px;color:var(--suave)">Panel de vendedores</a>
  <div class="info" id="info">cargando…</div>
</header>
<main id="chat">
  <div class="msg bot">¡Hola! Dime cuánto dinero y tiempo tienes, dónde estás y si tienes alguna preferencia, y te recomiendo qué comer en el campus.</div>
  <div class="ejemplos" id="ejemplos">
    <button>Tengo 10.000 pesos y 15 minutos, estoy en Ingeniería y quiero algo vegetariano</button>
    <button>¿Dónde puedo comprar fresas con chocolate?</button>
    <button>¿En qué cafetería puedo comprar un almuerzo?</button>
    <button>¿Qué puedo comprar con $5.000?</button>
    <button>¿Qué bebidas frías hay en María Café?</button>
  </div>
</main>
<form id="form">
  <input id="entrada" placeholder="Escribe tu pregunta…" autocomplete="off" autofocus>
  <button id="enviar">Enviar</button>
</form>
<script>
const chat = document.getElementById('chat'), entrada = document.getElementById('entrada'), enviar = document.getElementById('enviar');

function agregar(clase, texto) {
  const d = document.createElement('div'); d.className = clase; d.textContent = texto;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function agregarTraza(r) {
  if (!r.trazas || !r.trazas.length) return;
  const d = document.createElement('div'); d.className = 'traza';
  d.innerHTML = r.trazas.map(t => {
    let linea = `🔧 ${t.herramienta}(${JSON.stringify(t.argumentos)}) · ${t.latencia_ms} ms`;
    if (t.descartados && t.descartados.length) linea += ` · ignorados (no los dijiste): ${t.descartados.join(', ')}`;
    const span = document.createElement('span'); span.textContent = linea; if (!t.ok) span.className = 'err';
    return span.outerHTML;
  }).join('<br>') + `<br>⏱️ ${r.latencia_ms} ms en total · ${r.pasos} paso(s)`;
  chat.appendChild(d);
}
async function preguntar(texto) {
  document.getElementById('ejemplos')?.remove();
  agregar('msg usuario', texto);
  const pensando = agregar('msg bot', 'Consultando…');
  enviar.disabled = true;
  try {
    const resp = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mensaje: texto})});
    const r = await resp.json();
    pensando.remove(); agregarTraza(r); agregar('msg bot', r.texto || r.error || '(sin respuesta)');
  } catch (e) { pensando.textContent = '⚠️ No se pudo contactar al servidor.'; }
  enviar.disabled = false; entrada.focus();
}
document.getElementById('form').onsubmit = e => { e.preventDefault(); const t = entrada.value.trim(); if (t) { entrada.value=''; preguntar(t); } };
document.querySelectorAll('#ejemplos button').forEach(b => b.onclick = () => preguntar(b.textContent));
document.getElementById('reiniciar').onclick = async () => { await fetch('/api/reiniciar', {method:'POST'}); location.reload(); };
fetch('/api/reiniciar', {method:'POST'});  // pantalla nueva = conversación nueva
fetch('/api/info').then(r => r.json()).then(i => {
  document.getElementById('info').textContent = `${i.organizacion} · ${i.modo} · modelo ${i.modelo} · ${i.herramientas.length} herramientas MCP`;
});
</script>
</body>
</html>
